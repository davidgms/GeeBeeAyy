[package]
name = "geebee-core"
version = "0.1.0"
edition = "2021"
description = "GeeBee-A! GBA Emulation Core"
license = "MIT"
authors = ["GeeBee-A! Contributors"]

[lib]
name = "geebee_core"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "geebee"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]

[dependencies]
log = "0.4"
thiserror = "1.0"

[dev-dependencies]
# criterion = "0.5"

# [[bench]]
# name = "cpu_bench"
# harness = false
