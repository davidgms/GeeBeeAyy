[package]
name = "geebeeayy-core"
version = "0.1.0"
edition = "2021"
description = "GeeBeeAyy! GBA Emulation Core"
license = "MIT"
authors = ["GeeBeeAyy! Contributors"]

[lib]
name = "geebeeayy_core"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "geebeeayy"
path = "src/main.rs"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
android_logger = "0.14"

[target.'cfg(target_os = "ios")'.dependencies]

[dependencies]
log = "0.4"
thiserror = "1.0"

[dev-dependencies]
# criterion = "0.5"

# [[bench]]
# name = "cpu_bench"
# harness = false

[profile.release]
lto = "fat"
codegen-units = 1
